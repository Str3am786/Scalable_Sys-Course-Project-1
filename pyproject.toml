[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scalable_system"
version = "0.1.0"
description = "Scalable systems course project: Redis streams + sharded workers + shedding"
requires-python = ">=3.12"
dependencies = [
  "redis>=5.0.0,<6",             # runtime dependency used by io/redis_client.py
  "python-dateutil>=2.8,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["scalable_system*"]
