services:
  producer:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: "producer"
    volumes:
      - ./2017-citibike-tripdata:/app/data:ro
    stdin_open: true
    tty: true
    command: ["python" , "src/produce.py"]
    # command: ["/bin/bash"]
    depends_on:
      - redis
      - consumer
