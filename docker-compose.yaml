services:
  producer:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: "producer"
    volumes:
      - ./2017-citibike-tripdata:/app/data:ro
    stdin_open: true
    tty: true
    command: ["python" , "src/produce.py"]
    # command: ["/bin/bash"]
    depends_on:
      - redis
      - consumer

  consumer:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: "consumer"
    volumes:
      - ./matches:/app/matches:wo
    stdin_open: true
    tty: true 
    command: ["python", "src/consume.py"]     
    
    depends_on:
      - redis

  redis:
    container_name: redis
    image: redis:latest
    ports:
      - "6379:6379"

  redisinsight:
    container_name: redisinsight
    image: redis/redisinsight
    ports:
      - "5540:5540"
  

